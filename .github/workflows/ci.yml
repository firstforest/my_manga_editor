name: CI

# リリース (main への push) の前に develop / PR で品質ゲートを通すための workflow。
# analyze / test は scripts/release.sh の品質ゲートと揃えてある。
# format とコード生成のズレはリリース元の develop がここを通っているので release.sh では見ない。
on:
  pull_request:
  push:
    branches: [ "develop" ]
  workflow_dispatch:

# 同じ ref に新しい push が来たら古い実行は打ち切る
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze_test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          # mise.toml には ruby / node も含まれるが解析・テストには不要。
          # 特に ruby はソースビルドになり CI が大幅に遅くなるため入れない。
          install_args: flutter

      - name: Install dependencies (root)
        run: flutter pub get

      - name: Install dependencies (my_manga_editor_data)
        run: flutter pub get
        working-directory: local_package/my_manga_editor_data

      - name: Install dependencies (my_manga_editor_common)
        run: flutter pub get
        working-directory: local_package/my_manga_editor_common

      - name: Check format (root)
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Check format (my_manga_editor_data)
        run: dart format --output=none --set-exit-if-changed lib test
        working-directory: local_package/my_manga_editor_data

      - name: Check format (my_manga_editor_common)
        run: dart format --output=none --set-exit-if-changed lib test
        working-directory: local_package/my_manga_editor_common

      # 生成し忘れを検知する。生成物の差分は AI レビューの入力も膨らませる
      - name: Generate code (root)
        run: dart run build_runner build -d

      - name: Generate code (my_manga_editor_data)
        run: dart run build_runner build -d
        working-directory: local_package/my_manga_editor_data

      - name: Check generated code is committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            echo "::error::生成ファイルがコミットされた内容と一致しません。build_runner build -d を実行してコミットしてください"
            exit 1
          fi

      - name: Analyze (root)
        run: flutter analyze

      # flutter analyze はカレントパッケージのみが対象なので local_package は個別に流す
      - name: Analyze (my_manga_editor_data)
        run: flutter analyze
        working-directory: local_package/my_manga_editor_data

      - name: Analyze (my_manga_editor_common)
        run: flutter analyze
        working-directory: local_package/my_manga_editor_common

      - name: Test (root)
        run: flutter test

      # flutter test も同様。ルートの flutter test には含まれない
      - name: Test (my_manga_editor_data)
        run: flutter test
        working-directory: local_package/my_manga_editor_data

      - name: Test (my_manga_editor_common)
        run: flutter test
        working-directory: local_package/my_manga_editor_common

  build_web:
    name: Build Web (prod)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          install_args: flutter

      - name: Install dependencies
        run: flutter pub get

      # デプロイ (main.yml) と同じ条件でビルドし、main へマージしてから
      # 初めてビルドが壊れていると分かる事態を防ぐ
      - name: Build Flutter Web
        run: flutter build web --release --dart-define=ENV=prod --base-href /
