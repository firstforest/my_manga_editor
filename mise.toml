[tools]
flutter = "3.44.4"
ruby = "latest"
node = "22"

# 依存解決（Flutter ルート / データ層パッケージ + Node ツール）
# Node 依存（firebase-tools, google-auth-library）は config/deploy 系タスクで使う
[tasks.setup]
run = [
  "flutter pub get",
  "cd local_package/my_manga_editor_data && flutter pub get",
  "npm ci",
]

# コード生成（ルートパッケージ）
[tasks.gen]
run = "dart run build_runner build -d"

# コード生成（データ層パッケージ）
[tasks.gen-data]
run = "dart run build_runner build -d"
dir = "local_package/my_manga_editor_data"

# コード生成（両パッケージ）
[tasks.gen-all]
depends = ["gen", "gen-data"]

# 実行（dev: Firebase dev プロジェクト。ENV のデフォルトが dev）
# Web 実行時はポートを 50505 に固定（Firebase Auth のログイン状態を origin 単位で維持するため）
[tasks.run]
run = "flutter run --web-port=50505"

# 実行（prod: Firebase prod プロジェクト）
[tasks.run-prod]
run = "flutter run --web-port=50505 --dart-define=ENV=prod"

# Firestore セキュリティルールのデプロイ（dev: デフォルトプロジェクト）
# 事前に `npx firebase login` を対話ターミナルで済ませておくこと
[tasks.deploy-rules]
run = "npx firebase deploy --only firestore:rules"

# Firestore セキュリティルールのデプロイ（prod）
[tasks.deploy-rules-prod]
run = "npx firebase deploy --only firestore:rules --project prod"

# Firestore の config/app を読み書きする（scripts/config.mjs）。
# 認証: ADC（gcloud auth application-default login）。詳細は scripts/config.mjs 参照。
# set は常に変更前後を表示し updatedAt を記録。確認(y/N)は prod or 未知フィールド時のみ。
# mise は引数を run の末尾に追記するので set タスクには key value がそのまま渡る。
[tasks.config-get]
run = "node scripts/config.mjs dev get"

[tasks.config-get-prod]
run = "node scripts/config.mjs prod get"

# 例: mise run config-set minSupportedBuildNumber 2
[tasks.config-set]
run = "node scripts/config.mjs dev set"

# 例: mise run config-set-prod minSupportedBuildNumber 2
[tasks.config-set-prod]
run = "node scripts/config.mjs prod set"

# アプリ内お知らせ。全利用者の画面上部にバナーで出る（デプロイ不要で即時に反映）。
# リリース前の事前告知に使う。詳細は docs/release.md の「利用者への影響が大きい変更」。
# 例: mise run notice-prod "8/10 20時ごろ更新します。作業中の内容は保存してください"
[tasks.notice]
run = "node scripts/config.mjs dev notice"

[tasks.notice-prod]
run = "node scripts/config.mjs prod notice"

# 告知を取り下げる（リリース完了後に必ず実行する）
[tasks.notice-clear]
run = "node scripts/config.mjs dev notice-clear"

[tasks.notice-clear-prod]
run = "node scripts/config.mjs prod notice-clear"

# 静的解析
[tasks.analyze]
run = "flutter analyze"

# テスト
[tasks.test]
run = "flutter test"
# --- リリース運用 (詳細: docs/release.md) -----------------------------------

# 本番リリース (scripts/release.sh)。引数: patch(デフォルト)|minor|major, --dry-run 等
# 例: mise run release / mise run release minor / mise run release --dry-run
[tasks.release]
run = "./scripts/release.sh"

# Firestore 全ドキュメントのバックアップ → backups/<env>-<日時>/ (git 管理外)
# 認証は ADC (gcloud auth application-default login)。config-get と同じ
[tasks.backup]
run = "node scripts/firestore_backup.mjs dev"

[tasks.backup-prod]
run = "node scripts/firestore_backup.mjs prod"

# Firestore バックアップの復元 (上書き復元)。引数にバックアップディレクトリを渡す
# 例: mise run restore-prod backups/prod-20260706-120000
# 部分復元: mise run restore-prod backups/... --only users/<uid>/mangas/<id>
[tasks.restore]
run = "node scripts/firestore_restore.mjs dev"

[tasks.restore-prod]
run = "node scripts/firestore_restore.mjs prod"

# Web アプリのロールバック: 過去のリリースタグから GitHub Pages を再デプロイする
# 例: mise run rollback-web v1.0.1+2
# 注意: main ブランチは直らないので、恒久対応 (revert / fix-forward) を忘れないこと
[tasks.rollback-web]
run = "gh workflow run main.yml --ref"
