name: Build & Deploy Flutter Web to Cloudflare Workers

# main への push で本番 (Cloudflare Workers + prod Firebase) へデプロイする。
# workflow_dispatch はロールバック用 (`mise run rollback-web <tag>` が過去タグ ref で起動する)。
#
# 必要な設定 (docs/release.md の「Cloudflare の初期設定」参照):
#   secrets.CLOUDFLARE_API_TOKEN (アカウント ID はトークンから自動で決まる)
#   vars.PRODUCTION_URL (疎通確認の対象。末尾 / 付き)
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

# 本番へのデプロイは同時に 1 つだけ。実行中のデプロイは中断しない
# (途中で止めると公開物が中途半端な状態になるため cancel-in-progress: false)
concurrency:
  group: "production"
  cancel-in-progress: false

jobs:
  build_deploy:
    runs-on: ubuntu-latest

    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          # ruby はソースビルドになり CI が大幅に遅くなるため入れない。node は wrangler 用
          install_args: flutter node
      - name: Install dependencies
        run: flutter pub get
      - name: Install wrangler
        run: npm ci
      - name: Build Flutter Web
        run: flutter build web --release --dart-define=ENV=prod --base-href /
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --message "${GITHUB_REF_NAME}@${GITHUB_SHA::7}"

      # 「Actions は緑なのに本番が 404」を検知するのが目的。
      # 反映に時間がかかることがあるためリトライしながら確認する
      - name: Smoke test (公開ページの疎通確認)
        env:
          URL: ${{ vars.PRODUCTION_URL }}
        run: |
          if [ -z "${URL}" ]; then
            echo "::error::vars.PRODUCTION_URL が未設定です"
            exit 1
          fi
          echo "checking ${URL}"
          for i in $(seq 1 10); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "${URL}main.dart.js" || echo 000)
            if [ "$code" = "200" ]; then
              echo "OK: main.dart.js を配信できています (attempt ${i})"
              exit 0
            fi
            echo "attempt ${i}: HTTP ${code} — 反映待ち"
            sleep 15
          done
          echo "::error::デプロイ後に ${URL}main.dart.js を取得できませんでした"
          exit 1
